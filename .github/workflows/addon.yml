name: Build HA Addon

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "addon/**"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch: [aarch64, amd64, armhf, armv7]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get build base image
        id: base
        run: |
          case "${{ matrix.arch }}" in
            aarch64) echo "from=ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.19" >> $GITHUB_OUTPUT ;;
            amd64)   echo "from=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.19"   >> $GITHUB_OUTPUT ;;
            armhf)   echo "from=ghcr.io/home-assistant/armhf-base-python:3.12-alpine3.19"   >> $GITHUB_OUTPUT ;;
            armv7)   echo "from=ghcr.io/home-assistant/armv7-base-python:3.12-alpine3.19"   >> $GITHUB_OUTPUT ;;
          esac

      - name: Extract version
        id: version
        run: |
          echo "version=$(grep '^version:' addon/config.yaml | awk '{print $2}' | tr -d '\"')" >> $GITHUB_OUTPUT

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/Dockerfile
          push: true
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.from }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/printer-queue/ad5x-print-queue-${{ matrix.arch }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/printer-queue/ad5x-print-queue-${{ matrix.arch }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}